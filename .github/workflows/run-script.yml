name: Render Service Keep-Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs every 10 minutes
  workflow_dispatch:        # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Services
        id: ping_step
        run: |
          URLS=(
            "https://florist-ke.onrender.com"
            "https://cybernet-sro7.onrender.com"
            "https://comas.onrender.com"
            "https://mindhealthconsultancy.com"
            "https://interunihackathon.co.ke"
            "https://cybernet-portals.onrender.com"
          )

          FAILED=false

          for url in "${URLS[@]}"; do
            echo "Pinging $url..."
            if ! curl -sL --fail --max-time 15 "$url" > /dev/null; then
              echo "::error ::Failed to reach $url"
              FAILED=true
            fi
          done

          # This line forces the step to fail if any URL was unreachable
          if [ "$FAILED" = true ]; then
            exit 1
          fi

      - name: Send Email Report on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }} 
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Portfolio Monitor: Service Downtime Alert"
          to: kingsleymwangi05@gmail.com
          from: Portfolio Monitor AI
          body: |
            Downtime detected during scheduled check.
            
            The following services are unreachable:
            ${{ steps.ping_step.outputs.failed_list }}
            
            View full logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
